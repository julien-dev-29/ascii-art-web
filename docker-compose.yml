services:
  ascii-art-web:
    build:
      context: .
      args:
        VERSION: "1.0.0"
        BUILD_DATE: ""
    image: ascii-art-web:1.0.0
    container_name: ascii-art-web
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
