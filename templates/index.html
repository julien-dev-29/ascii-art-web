<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Home</title>
</head>

<body>
    <div class="container mt-5">
        <h1>{{ .Title}}</h1>
        <form method="post" action="/ascii-art">
            <label for="text">Text</label>
            <textarea name="text" class="form-control" style="height: 100px"></textarea>
            <div class="form-check mt-3">
                <input class="form-check-input" type="radio" name="banner" value="standard" id="radioDefault1">
                <label class="form-check-label" for="radioDefault1">
                    Standard
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="banner" value="shadow" id="radioDefault2" checked>
                <label class="form-check-label" for="radioDefault2">
                    Shadow
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="banner" value="thinkertoy" id="radioDefault2"
                    checked>
                <label class="form-check-label" for="radioDefault2">
                    Thinkertoy
                </label>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Generate</button>
        </form>
        <pre>
            {{ .Result}}
        </pre>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
</body>

</html>
